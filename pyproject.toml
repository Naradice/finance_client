# pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance_client"
version = "0.0.1"
dependencies = [
    "numpy",
    "pandas",
    "statsmodels",
    "matplotlib",
    "MetaTrader5",
    "websocket-client",
    "python-dotenv",
    "PyYAML",
    "yfinance",
    "selenium",
    "pandas_datareader",
    # required for pandas_datareader if python >= 3.12
    "setuptools",
    "google_auth_oauthlib"
]

[tool.black]
line-length = 150
target-version = ['py312']
include = '\.py$'

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# logger.py's setup_logging() unconditionally opens one of these at import time (finance_client/
# __init__.py -> logger.setup_logging()) -- without this, a normal (non-editable) `pip install`
# omits them (setuptools only includes .py files by default), so `import finance_client` fails
# with FileNotFoundError on any environment that installed it via `pip install .` or a git URL
# instead of `pip install -e`. Confirmed live installing from a git URL into a clean container.
finance_client = ["logging.yaml", "logging_test.yaml"]